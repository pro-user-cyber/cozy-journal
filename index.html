<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Voice Journal Starter</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
    textarea { width: 100%; height: 200px; margin-top: 10px; border-radius: 8px; padding: 10px; }
    button { padding: 10px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

  <h2>🎙️ Voice-to-Text Journal</h2>
  <button id="recordBtn">Start Speaking</button>
  <textarea id="journalInput" placeholder="Your speech will appear here..."></textarea>

  <script>
    const recordBtn = document.getElementById('recordBtn');
    const journalInput = document.getElementById('journalInput');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;

      let isRecording = false;

      recordBtn.addEventListener('click', () => {
        if (!isRecording) {
          recognition.start();
          recordBtn.innerText = '🛑 Stop Recording';
        } else {
          recognition.stop();
          recordBtn.innerText = '🎙️ Start Speaking';
        }
        isRecording = !isRecording;
      });

      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = 0; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        journalInput.value = transcript;
      };
    } else {
      alert('Speech Recognition is not supported in this browser.');
    }
  </script>

</body>
</html>
